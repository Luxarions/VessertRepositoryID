<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Vessert — Standalone Code Viewer Example</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-[#c9d1d9] min-h-screen p-6 font-sans">
	<div class="max-w-4xl mx-auto space-y-4">
		<header class="flex items-center justify-between border-b border-[#30363d] pb-4">
			<div>
				<h1 class="text-xl font-bold text-white flex items-center gap-2">
					<span class="text-blue-400">Vessert</span> / Code Viewer Module
				</h1>
				<p class="text-xs text-[#8b949e]">Isolasi komponen <code>src/files/FileViewer.js</code> lengkap dengan Syntax Highlighting dan Code Runner.</p>
			</div>
			<a href="./index.html" class="text-xs px-3 py-1.5 bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] rounded text-white transition">
				← Kembali ke Katalog Contoh
			</a>
		</header>

		<!-- Container Viewer -->
		<div id="viewer-container" class="rounded-lg overflow-hidden"></div>
	</div>

	<script type="module">
		import { FileViewer } from '../src/files/FileViewer.js';
		import { runCode } from '../src/files/CodeRunner.js';

		const container = document.getElementById('viewer-container');
		
		const sampleFile = {
			name: 'fibonacci.js',
			path: 'examples/fibonacci.js',
			size: '640 B',
			language: 'javascript',
			content: `// Interactive Fibonacci generator
function fibonacci(n) {
  const seq = [0, 1];
  for (let i = 2; i < n; i++) {
    seq.push(seq[i - 1] + seq[i - 2]);
  }
  return seq;
}

console.log("Menghitung 10 angka pertama Fibonacci:");
const result = fibonacci(10);
console.log("Hasil:", result.join(", "));
console.log("Selesai dieksekusi!");
`
		};

		const state = {
			selectedFile: sampleFile,
			repo: {
				name: 'vessert',
				defaultBranch: 'main',
				lastCommit: {
					author: 'prssbayu-oss',
					message: 'feat: showcase standalone code viewer',
					hash: 'a9f24b1',
					date: '1 minute ago'
				}
			},
			isConsoleOpen: true,
			consoleLogs: [],
			copied: false
		};

		function render() {
			container.innerHTML = FileViewer( state );
			bindEvents();
		}

		function bindEvents() {
			container.querySelector('#file-run-btn')?.addEventListener('click', () => {
				const logs = runCode(state.selectedFile.content);
				state.consoleLogs = logs;
				state.isConsoleOpen = true;
				render();
			});

			container.querySelector('#file-console-close-btn')?.addEventListener('click', () => {
				state.isConsoleOpen = false;
				render();
			});

			container.querySelector('#file-copy-btn')?.addEventListener('click', () => {
				navigator.clipboard?.writeText(state.selectedFile.content);
				state.copied = true;
				render();
				setTimeout(() => {
					state.copied = false;
					render();
				}, 1500);
			});
		}

		// Initial code run to populate logs
		state.consoleLogs = runCode(sampleFile.content);
		render();
	</script>
</body>
</html>
