<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Vessert — Icons Gallery Showcase</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-[#c9d1d9] min-h-screen p-6 font-sans">
	<div class="max-w-6xl mx-auto space-y-6">
		<header class="flex items-center justify-between border-b border-[#30363d] pb-4">
			<div>
				<h1 class="text-xl font-bold text-white flex items-center gap-2">
					<span class="text-emerald-400">Vessert</span> / Procedural Icons Showcase
				</h1>
				<p class="text-xs text-[#8b949e]">Seluruh 33 ikon prosedural dari <code>src/icons/</code> — 100% JavaScript string functions, zero-image dependency.</p>
			</div>
			<div class="flex items-center gap-3">
				<input id="search-input" type="text" placeholder="Filter ikon..." class="px-3 py-1 bg-[#161b22] border border-[#30363d] rounded text-sm text-white focus:outline-none focus:border-blue-500" />
				<a href="./index.html" class="text-xs px-3 py-1.5 bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] rounded text-white transition">
					← Katalog Contoh
				</a>
			</div>
		</header>

		<div id="icons-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
	</div>

	<script type="module">
		import * as Icons from '../src/icons/icons.js';

		const grid = document.getElementById('icons-grid');
		const searchInput = document.getElementById('search-input');

		const iconKeys = Object.keys(Icons).sort();

		function renderIcons(filter = '') {
			grid.innerHTML = '';
			const filtered = iconKeys.filter(key => key.toLowerCase().includes(filter.toLowerCase()));

			if (filtered.length === 0) {
				grid.innerHTML = `<div class="col-span-full py-12 text-center text-[#8b949e]">Tidak ada ikon yang cocok dengan "${filter}"</div>`;
				return;
			}

			filtered.forEach(key => {
				const iconFn = Icons[key];
				const svgHtml = typeof iconFn === 'function' ? iconFn(24, 'text-gray-300') : '';

				const card = document.createElement('div');
				card.className = 'p-4 bg-[#161b22] border border-[#30363d] hover:border-blue-500 rounded-lg flex flex-col items-center justify-center gap-3 group transition cursor-pointer';
				card.title = `Klik untuk salin nama import: ${key}`;
				card.innerHTML = `
					<div class="w-10 h-10 flex items-center justify-center rounded bg-[#21262d] group-hover:scale-110 transition">
						${svgHtml}
					</div>
					<span class="text-xs font-mono text-center text-gray-400 group-hover:text-white truncate w-full">${key}</span>
				`;

				card.addEventListener('click', () => {
					navigator.clipboard?.writeText(key);
					const label = card.querySelector('span');
					const originalText = label.textContent;
					label.textContent = 'Tersalin!';
					label.classList.add('text-emerald-400');
					setTimeout(() => {
						label.textContent = originalText;
						label.classList.remove('text-emerald-400');
					}, 1200);
				});

				grid.appendChild(card);
			});
		}

		searchInput.addEventListener('input', (e) => renderIcons(e.target.value));
		renderIcons();
	</script>
</body>
</html>
